<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#E65A1E" />
        <meta name="description" content="WorkHop — Your next local gig, one minute away. Hyperlocal platform connecting verified pros and gigs within 5km in Bengaluru. Instant call, direct chat, zero middlemen." />
        <meta name="keywords" content="hyperlocal freelance, gigs in bengaluru, hire freelancers bangalore, koramangala freelancers, indiranagar designers, developers, videographers, hire local talent, workhop" />
        <meta name="author" content="WorkHop Technologies" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://workhop.in/" />

        <!-- Web App Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="WorkHop" />
        <meta property="og:title" content="WorkHop · Your next local gig, one minute away" />
        <meta property="og:description" content="Hyperlocal platform connecting verified pros and gigs within 5km in Bengaluru. Direct phone unlock, zero middlemen, keep 100% earnings." />
        <meta property="og:url" content="https://workhop.in/" />
        <meta property="og:image" content="https://workhop.in/workhop-logo.png" />
        <meta property="og:locale" content="en_IN" />

        <!-- Twitter / X Cards -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="WorkHop · Your next local gig, one minute away" />
        <meta name="twitter:description" content="Connect with verified freelance experts within 5km of your block. Instant call & chat." />
        <meta name="twitter:image" content="https://workhop.in/workhop-logo.png" />

        <!-- Schema.org JSON-LD Structured Data for Search Engines -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "WebSite",
              "@id": "https://workhop.in/#website",
              "url": "https://workhop.in/",
              "name": "WorkHop",
              "description": "Hyperlocal freelance platform connecting verified pros and gigs within 5km in Bengaluru",
              "potentialAction": {
                "@type": "SearchAction",
                "target": "https://workhop.in/map?q={search_term_string}",
                "query-input": "required name=search_term_string"
              }
            },
            {
              "@type": "Organization",
              "@id": "https://workhop.in/#organization",
              "name": "WorkHop Technologies",
              "url": "https://workhop.in/",
              "logo": "https://workhop.in/workhop-logo.png"
            },
            {
              "@type": "LocalBusiness",
              "@id": "https://workhop.in/#localbusiness",
              "name": "WorkHop Bengaluru",
              "description": "Hyperlocal on-demand talent & gig matching platform",
              "address": {
                "@type": "PostalAddress",
                "addressLocality": "Bengaluru",
                "addressRegion": "Karnataka",
                "addressCountry": "IN"
              },
              "geo": {
                "@type": "GeoCoordinates",
                "latitude": 12.9716,
                "longitude": 77.5946
              }
            }
          ]
        }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="alternate icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/favicon.svg" />
        <title>WorkHop · Your next local gig, one minute away</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
